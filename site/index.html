<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belt/Chain/Gear Combination Calculator</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 1rem auto; padding: 0 1rem; }
    nav button { padding: .5rem 1rem; border: 1px solid #888; background: #eee; cursor: pointer; }
    nav button.active { background: #fff; border-bottom-color: #fff; font-weight: bold; }
    .panel { border: 1px solid #888; padding: 1rem; margin-top: -1px; }
    .field { display: grid; grid-template-columns: 22rem 1fr; gap: .5rem; margin: .3rem 0; align-items: center; }
    .field input { width: 100%; box-sizing: border-box; font-family: monospace; }
    .field small { color: #666; }
    .buttons { margin: 1rem 0; }
    .buttons button { padding: .4rem 1rem; margin-right: .5rem; }
    pre.output { background: #f6f6f6; padding: 1rem; overflow-x: auto; white-space: pre; }
    .error { color: #b00; }
    @media (max-width: 600px) { .field { grid-template-columns: 1fr; } }
  </style>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
  <h1>Belt/Chain/Gear Combination Calculator</h1>
  <nav id="tabs"></nav>
  <div id="panels"></div>
  <script src="app.js"></script>
</body>
</html>
